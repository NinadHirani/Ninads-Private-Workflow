name: Transfer rebuilt web index
on:
  push:
    paths:
      - '.github/workflows/asf-transfer-index.yml'
permissions:
  contents: write
concurrency:
  group: asf-transfer-index
  cancel-in-progress: true
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/web-ui-read-auth
          persist-credentials: true
      - name: Fetch rebuilt page and verify byte-for-byte
        run: |
          set -e
          if [ -f web/index.html ] && echo "c8e387fe53e4d19e76c092efdb567970  web/index.html" | md5sum -c --status; then
            echo "web/index.html already matches the verified build; nothing to do"
            exit 0
          fi
          curl -fsSL --max-time 120 -o web/index.new.html 'https://storage.googleapis.com/wajo-ai-agentnet-uploads-nam4/users/15bfd9a1-08df-48a0-8542-38d64604e2a1/sessions/c91629e6-c3e3-49f3-b2c5-38c5ceddee3e/0a93d258-ce97-5d11-b700-8e98e047b940/web_index_final.html?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=agentnet-runtime%40wajo-ai.iam.gserviceaccount.com%2F20261015%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261015T065608Z&X-Goog-Expires=899&X-Goog-&X-Goog-SignedHeaders=host&response-content-type=text%2Fhtml'
          echo "c8e387fe53e4d19e76c092efdb567970  web/index.new.html" | md5sum -c -
          mv web/index.new.html web/index.html
      - name: Commit the rebuilt page
        run: |
          set -e
          git config user.name "Ninad Y Hirani"
          git config user.email "140402321+NinadHirani@users.noreply.github.com"
          git add web/index.html
          if git diff --cached --quiet; then
            echo "No change to commit"
            exit 0
          fi
          git commit -m "Web UI: session-cookie auth on mobile PWA; token stays memory-only"
          git push
